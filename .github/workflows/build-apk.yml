name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      api_base:
        description: 'Backend API URL'
        required: true
        default: 'http://127.0.0.1:8000'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Debug environment
        run: |
          echo "========================================="
          echo "ENVIRONMENT DEBUG INFORMATION"
          echo "========================================="
          echo ""
          echo "Java version:"
          java -version 2>&1
          echo ""
          echo "Node version:"
          node --version
          echo ""
          echo "NPM version:"
          npm --version
          echo ""
          echo "Memory:"
          free -h
          echo "========================================="

      - name: Clean Gradle cache
        run: |
          echo "Cleaning Gradle cache..."
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/
          mkdir -p ~/.gradle/caches/
          chmod -R 777 ~/.gradle/
          echo "Gradle cache cleaned"

      - name: Update API Base URL
        run: |
          mkdir -p frontend
          cat > frontend/config.js << 'EOF'
          const APP_CONFIG = {
              API_BASE: 'API_BASE_PLACEHOLDER',
              APP_NAME: 'Garden Mystery',
              APP_VERSION: '1.0.0'
          };
          EOF
          sed -i "s|API_BASE_PLACEHOLDER|${{ github.event.inputs.api_base || 'http://127.0.0.1:8000' }}|g" frontend/config.js
          echo "Created frontend/config.js"

      - name: Create package.json
        run: |
          cat > package.json << 'EOF'
          {
            "name": "puzzle-game-frontend",
            "version": "1.0.0",
            "description": "Frontend for Garden Mystery puzzle game",
            "main": "index.js",
            "scripts": {
              "build": "echo 'No build step required'"
            },
            "dependencies": {},
            "devDependencies": {}
          }
          EOF
          echo "package.json created"

      - name: Install Capacitor dependencies
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          echo "Capacitor packages installed"

      - name: Build web assets
        run: |
          mkdir -p www
          if [ -d "frontend" ]; then
            cp -r frontend/* www/
            echo "Copied from frontend/ directory"
          else
            cp -r *.html *.css *.js www/ 2>/dev/null || echo "No root files found"
          fi
          echo "www directory contents:"
          ls -la www/

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.yourcompany.gardenmystery",
            "appName": "Garden Mystery",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true,
              "allowNavigation": ["http://*", "https://*"]
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF
          echo "capacitor.config.json created"

      - name: Initialize Capacitor
        run: |
          npx cap init "Garden Mystery" "com.yourcompany.gardenmystery" --web-dir=www
          echo "Capacitor initialized"

      - name: Add Android platform
        run: |
          npx cap add android
          echo "Android platform added"

      - name: Create gradle.properties
        run: |
          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx1024m
          org.gradle.daemon=false
          org.gradle.parallel=true
          android.useAndroidX=true
          EOF
          echo "gradle.properties created:"
          cat android/gradle.properties

      - name: Sync web assets to Android
        run: |
          npx cap sync android
          echo "Sync completed"

      - name: Grant execute permission for Gradle
        run: |
          cd android
          chmod +x gradlew
          echo "Permissions set"

      - name: Build APK
        run: |
          echo "Starting APK build..."
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: List APK files
        run: |
          echo "Searching for APK files..."
          find android/app/build/outputs -name "*.apk" -type f || echo "No APK found"
          ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || echo "Debug APK directory not found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Build completion message
        run: |
          echo "========================================="
          echo "BUILD PROCESS COMPLETED"
          echo "========================================="
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✓ APK successfully generated"
            echo "APK size: $(du -h android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)"
          else
            echo "✗ APK not found - build failed"
            echo "Check the logs above for errors"
          fi
          echo "========================================="
