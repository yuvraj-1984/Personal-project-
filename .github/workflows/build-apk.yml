name: Build Android APK - Simple

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create www directory
        run: |
          mkdir -p www
          cp -r frontend/* www/ 2>/dev/null || cp -r *.html *.css *.js www/ 2>/dev/null || echo "No files to copy"
          echo "Directory contents:"
          ls -la www/

      - name: Install Capacitor
        run: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json << EOF
          {
            "appId": "com.yourcompany.gardenmystery",
            "appName": "Garden Mystery",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true
            }
          }
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m"
        continue-on-error: true

      - name: Check APK
        run: |
          echo "Searching for APK files..."
          find . -name "*.apk" -type f || echo "No APK found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: "**/*.apk"
          if-no-files-found: warn
