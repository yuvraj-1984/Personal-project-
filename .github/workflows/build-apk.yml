name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      api_base:
        description: 'Backend API URL'
        required: true
        default: 'http://127.0.0.1:8000'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Clean Gradle cache
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/
          mkdir -p ~/.gradle/caches/
          chmod -R 777 ~/.gradle/

      - name: Update API Base URL
        run: |
          # Create/update config.js with the specified API URL
          mkdir -p frontend
          cat > frontend/config.js << EOF
          const APP_CONFIG = {
              API_BASE: '${{ github.event.inputs.api_base || 'http://127.0.0.1:8000' }}',
              APP_NAME: 'Garden Mystery',
              APP_VERSION: '1.0.0'
          };
          EOF

      - name: Install Capacitor dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Build web assets
        run: |
          mkdir -p www
          cp -r frontend/* www/ 2>/dev/null || echo "No frontend directory found"
          # List files to verify
          ls -la www/

      - name: Initialize Capacitor
        run: |
          npx cap init "Garden Mystery" "com.yourcompany.gardenmystery" --web-dir=www

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Grant execute permission for Gradle
        run: |
          cd android
          chmod +x gradlew
          chmod +x gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -Dorg.gradle.daemon=false"

      - name: List APK files
        run: |
          find android/app/build/outputs -name "*.apk" -type f

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
