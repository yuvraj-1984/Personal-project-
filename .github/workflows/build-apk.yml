name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      api_base:
        description: 'Backend API URL'
        required: true
        default: 'http://127.0.0.1:8000'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Debug environment
        run: |
          echo "========================================="
          echo "ENVIRONMENT DEBUG INFORMATION"
          echo "========================================="
          echo ""
          echo "Java version:"
          java -version 2>&1
          echo ""
          echo "Node version:"
          node --version
          echo ""
          echo "NPM version:"
          npm --version
          echo ""
          echo "Memory:"
          free -h
          echo ""
          echo "Disk space:"
          df -h
          echo "========================================="

      - name: Clean Gradle cache
        run: |
          echo "Cleaning Gradle cache..."
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/
          mkdir -p ~/.gradle/caches/
          chmod -R 777 ~/.gradle/
          echo "Gradle cache cleaned"

      - name: Update API Base URL
        run: |
          mkdir -p frontend
          cat > frontend/config.js << 'EOF'
          const APP_CONFIG = {
              API_BASE: 'API_BASE_PLACEHOLDER',
              APP_NAME: 'Garden Mystery',
              APP_VERSION: '1.0.0'
          };
          EOF
          sed -i "s|API_BASE_PLACEHOLDER|${{ github.event.inputs.api_base || 'http://127.0.0.1:8000' }}|g" frontend/config.js
          echo "Created frontend/config.js"
          cat frontend/config.js

      - name: Create package.json
        run: |
          cat > package.json << 'EOF'
          {
            "name": "puzzle-game-frontend",
            "version": "1.0.0",
            "description": "Frontend for Garden Mystery puzzle game",
            "main": "index.js",
            "scripts": {
              "build": "echo 'No build step required'"
            },
            "dependencies": {},
            "devDependencies": {}
          }
          EOF
          echo "package.json created"

      - name: Install Capacitor dependencies
        run: |
          echo "Installing Capacitor packages..."
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0
          echo "Capacitor packages installed:"
          npm list @capacitor/core @capacitor/cli @capacitor/android --depth=0

      - name: Build web assets
        run: |
          echo "Creating www directory..."
          mkdir -p www
          if [ -d "frontend" ]; then
            cp -r frontend/* www/
            echo "Copied from frontend/ directory"
          else
            cp -r *.html *.css *.js www/ 2>/dev/null || echo "No root files found"
          fi
          echo "www directory contents:"
          ls -la www/
          echo "Checking for index.html:"
          if [ -f "www/index.html" ]; then
            echo "✓ index.html found"
          else
            echo "✗ index.html NOT found"
          fi

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.yourcompany.gardenmystery",
            "appName": "Garden Mystery",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true,
              "allowNavigation": ["http://*", "https://*"]
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF
          echo "capacitor.config.json created"

      - name: Initialize Capacitor
        run: |
          npx cap init "Garden Mystery" "com.yourcompany.gardenmystery" --web-dir=www
          echo "Capacitor initialized"

      - name: Add Android platform
        run: |
          npx cap add android
          echo "Android platform added"
          ls -la android/

      - name: Create gradle.properties
        run: |
          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx1024m
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          echo "gradle.properties created:"
          cat android/gradle.properties

      - name: Sync web assets to Android
        run: |
          npx cap sync android
          echo "Sync completed"

      - name: Grant execute permission for Gradle
        run: |
          cd android
          chmod +x gradlew
          echo "Permissions set"

      # ═══════════════════════════════════════════════════════════════
      # 👇 ADD THE "Configure Android Manifest" STEP HERE 👇
      # ═══════════════════════════════════════════════════════════════
      - name: Configure Android Manifest
        run: |
          echo "Configuring AndroidManifest.xml..."
          
          # Add INTERNET permission if not exists
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
            echo "✓ Added INTERNET permission"
          else
            echo "✓ INTERNET permission already exists"
          fi
          
          # Add usesCleartextTraffic if not exists
          if ! grep -q "usesCleartextTraffic" android/app/src/main/AndroidManifest.xml; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
            echo "✓ Added usesCleartextTraffic"
          else
            echo "✓ usesCleartextTraffic already exists"
          fi
          
          echo "Final AndroidManifest.xml:"
          cat android/app/src/main/AndroidManifest.xml
      # ═══════════════════════════════════════════════════════════════
      # 👆 END OF "Configure Android Manifest" STEP 👆
      # ═══════════════════════════════════════════════════════════════

      - name: Build APK with detailed error output
        run: |
          echo "Starting APK build..."
          cd android
          # Run gradle with full error output
          ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -ne 0 ]; then
            echo "========================================="
            echo "BUILD FAILED WITH EXIT CODE: $exit_code"
            echo "========================================="
            echo ""
            echo "Last 100 lines of build log:"
            tail -100 build.log
            echo ""
            echo "Searching for error patterns:"
            grep -i "error\|failed\|exception\|what went wrong" build.log | tail -20
            echo ""
            echo "Checking SDK licenses:"
            ls -la $ANDROID_HOME/licenses/ 2>/dev/null || echo "No licenses directory found"
            echo ""
            echo "Checking Android SDK:"
            echo "ANDROID_HOME: $ANDROID_HOME"
            echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
            ls -la $ANDROID_HOME/ 2>/dev/null || echo "Android SDK not found"
            echo ""
            echo "Checking Java compatibility:"
            java -version
            echo "JAVA_HOME: $JAVA_HOME"
            exit $exit_code
          fi

      - name: List APK files
        run: |
          echo "Searching for APK files..."
          find android/app/build/outputs -name "*.apk" -type f || echo "No APK found"
          ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || echo "Debug APK directory not found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Build completion message
        run: |
          echo "========================================="
          echo "BUILD PROCESS COMPLETED"
          echo "========================================="
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✓ APK successfully generated"
            echo "APK size: $(du -h android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)"
          else
            echo "✗ APK not found - build failed"
            echo "Check the logs above for errors"
          fi
          echo "========================================="
