name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      api_base:
        description: 'Backend API URL'
        required: true
        default: 'http://127.0.0.1:8000'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Clean Gradle cache
        run: |
          echo "Cleaning Gradle cache..."
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/
          mkdir -p ~/.gradle/caches/
          chmod -R 777 ~/.gradle/
          echo "Gradle cache cleaned"

      - name: Debug environment
        run: |
          echo "========================================="
          echo "ENVIRONMENT DEBUG INFORMATION"
          echo "========================================="
          echo ""
          echo "Java version:"
          java -version 2>&1
          echo ""
          echo "Java home:"
          echo $JAVA_HOME
          echo ""
          echo "Node version:"
          node --version
          echo ""
          echo "NPM version:"
          npm --version
          echo ""
          echo "Current directory:"
          pwd
          echo ""
          echo "Directory contents:"
          ls -la
          echo ""
          echo "Frontend directory contents (if exists):"
          ls -la frontend/ 2>/dev/null || echo "No frontend directory"
          echo ""
          echo "Disk space:"
          df -h
          echo ""
          echo "Memory:"
          free -h
          echo ""
          echo "CPU info:"
          nproc
          echo ""
          echo "OS info:"
          cat /etc/os-release
          echo ""
          echo "========================================="
          echo "END DEBUG INFORMATION"
          echo "========================================="

      - name: Update API Base URL
        run: |
          # Create/update config.js with the specified API URL
          mkdir -p frontend
          cat > frontend/config.js << 'EOF'
          const APP_CONFIG = {
              API_BASE: 'API_BASE_PLACEHOLDER',
              APP_NAME: 'Garden Mystery',
              APP_VERSION: '1.0.0'
          };
          EOF
          # Replace placeholder with actual URL
          sed -i "s|API_BASE_PLACEHOLDER|${{ github.event.inputs.api_base || 'http://127.0.0.1:8000' }}|g" frontend/config.js
          echo "Created frontend/config.js with API_BASE: ${{ github.event.inputs.api_base || 'http://127.0.0.1:8000' }}"
          cat frontend/config.js

      - name: Install Capacitor dependencies
        run: |
          echo "Initializing npm project..."
          npm init -y
          echo "Installing Capacitor packages..."
          npm install @capacitor/core @capacitor/cli @capacitor/android
          echo "Capacitor packages installed:"
          npm list @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web assets
        run: |
          echo "Creating www directory..."
          mkdir -p www
          echo "Copying frontend files..."
          cp -r frontend/* www/ 2>/dev/null || echo "No frontend directory found, checking root..."
          cp -r *.html *.css *.js www/ 2>/dev/null || echo "No root HTML/CSS/JS files found"
          echo "www directory contents:"
          ls -la www/
          echo "Checking for index.html:"
          if [ -f "www/index.html" ]; then
            echo "✓ index.html found"
          else
            echo "✗ index.html NOT found - this will cause build failure"
            echo "Available files:"
            find . -maxdepth 2 -type f | sort
          fi

      - name: Initialize Capacitor
        run: |
          echo "Initializing Capacitor..."
          npx cap init "Garden Mystery" "com.yourcompany.gardenmystery" --web-dir=www
          echo "Capacitor initialized"
          echo "Capacitor config:"
          cat capacitor.config.json

      - name: Add Android platform
        run: |
          echo "Adding Android platform..."
          npx cap add android
          echo "Android platform added"
          echo "Android directory contents:"
          ls -la android/

      - name: Sync web assets to Android
        run: |
          echo "Syncing web assets..."
          npx cap sync android
          echo "Sync completed"

      - name: Grant execute permission for Gradle
        run: |
          echo "Setting execute permissions..."
          cd android
          chmod +x gradlew
          chmod +x gradle/wrapper/gradle-wrapper.jar 2>/dev/null || echo "gradle-wrapper.jar not found (will be downloaded)"
          echo "Permissions set"

      - name: Debug Gradle setup
        run: |
          echo "========================================="
          echo "GRADLE DEBUG INFORMATION"
          echo "========================================="
          cd android
          echo "Gradle wrapper version:"
          ./gradlew --version
          echo ""
          echo "Gradle files:"
          find . -name "*.gradle" -o -name "gradle-wrapper.properties" | sort
          echo ""
          echo "Gradle wrapper properties:"
          cat gradle/wrapper/gradle-wrapper.properties
          echo "========================================="

      - name: Build APK
        run: |
          echo "Starting APK build..."
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -Dorg.gradle.daemon=false"

      - name: List APK files
        run: |
          echo "Searching for APK files..."
          find android/app/build/outputs -name "*.apk" -type f || echo "No APK found"
          echo "Full APK path:"
          ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || echo "Debug APK directory not found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Build completion message
        run: |
          echo "========================================="
          echo "BUILD PROCESS COMPLETED"
          echo "========================================="
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✓ APK successfully generated"
            echo "APK size: $(du -h android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)"
          else
            echo "✗ APK not found - build failed"
            echo "Check the logs above for errors"
          fi
          echo "========================================="
